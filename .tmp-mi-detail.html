新校区隆重举行，灯光璀璨，人头攒动，欢声盈耳，几千名师生及历届校友代表欢聚一堂，共同回顾百年峥嵘，启航崭新征程。晚会华章在掌声中开启，当《长大后我就成了你》旋律响起，许多两鬓斑白的校友情不自禁轻声跟唱，手中摇曳的点点星光，汇成一片温暖的星海，将深厚的师生情谊渲染到极致。校歌《翰墨飘香》的旋律响彻云霄，全体师生校友齐声高唱，激昂的歌声在夜空中久久回荡。\\n\\n本场晚会采用 dBsource V12 线阵列音箱 16 只，V18/V21 超低频箱 16 只，206M 返听音箱 12 只，LA 系列辅助音箱及监听音箱等共计 68 只；整个系统角度精准、能量集中，完美覆盖整个晚会现场。无论是细腻的民谣吟唱，还是劲爆的摇滚乐表演，这套系统都能精准还原每一刻的乐感，让每位师生都能感受到最真实的音乐感受。\",\"en\":\"Dafang No.1 Middle School's centenary gala welcomed thousands of students and alumni with 68 dBsource boxes — V12 arrays, V18/V21 subs, 206M monitors and LA fills — covering folk and rock performances with precision.\"},\"image\":\"/strapi-uploads/medium_01_36deba5ecc.png\",\"imageUrl\":\"/strapi-uploads/medium_01_36deba5ecc.png\",\"gallery\":[\"/strapi-uploads/large_01_36deba5ecc.png\",\"/strapi-uploads/large_02_a50d898958.png\",\"/strapi-uploads/large_03_f5160616ac.png\",\"/strapi-uploads/large_04_e219e11b5f.png\",\"/strapi-uploads/large_05_f0c0f5156e.png\",\"/strapi-uploads/large_06_3356c4dcb4.png\",\"/strapi-uploads/large_07_c61679287e.png\",\"/strapi-uploads/large_08_2599783a7f.png\"],\"highlights\":{\"zh\":[\"建校 100 周年\",\"68 只音箱\",\"全校师生覆盖\"],\"en\":[\"100th anniversary\",\"68 loudspeakers\",\"Full campus coverage\"]},\"market\":\"all\"},{\"id\":5,\"sortOrder\":5,\"type\":\"performance\",\"title\":{\"zh\":\"贵州大方彝族新年晚会\",\"en\":\"Guizhou Dafang Yi New Year Gala\"},\"projectOverview\":{\"zh\":\"2025 年贵州「彝族新年」晚会在大方隆重举行，活动以「奢香故里庆彝年·民族团结谱新篇」为主题，展现彝族文化的独特魅力。精彩纷呈的文艺演出在灯光秀中拉开帷幕；现场旋律优美，舞姿翩跹，由 dBsource 音响系统带来的精准声场还原，更让每首乐曲都焕发出最动人的光彩，将这场彝族新年晚会的魅力推向极致。\\n\\n本场晚会采用 dBsource V12 线阵列音箱 16 只，V18/V21 超低频箱 16 只，206M 返听音箱 12 只，DO 系列辅助音箱 12 只及监听音箱等共计 58 只；整个系统角度精准、能量集中，完美覆盖整个晚会现场。无论是细腻的民谣吟唱，还是炸裂的电子节奏，这套系统都能精准还原每一刻的乐感，让每位观众都能感受到最真实的音乐感受。\",\"en\":\"The 2025 Yi New Year gala in Dafang, Guizhou featured 58 dBsource loudspeakers — V12 line arrays, V18/V21 subs, 206M monitors and DO fills — delivering precise coverage from folk ballads to electronic peaks.\"},\"image\":\"/strapi-uploads/medium_01_12fb311cab.png\",\"imageUrl\":
