# HTTP — 无证书时可直接用 IP/域名访问；有证书后取消下方 HTTPS 块注释

upstream dbsource_web {
  server web:3000;
}

upstream dbsource_strapi {
  server strapi:1337;
}

# 官网 + 内容后台
server {
  listen 80;
  server_name www.dbsourceaudio.com dbsourceaudio.com;

  location / {
    proxy_pass http://dbsource_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# Strapi 后端
server {
  listen 80;
  server_name cms.dbsourceaudio.com;

  location / {
    proxy_pass http://dbsource_strapi;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

